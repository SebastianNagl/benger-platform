name: CI

# The PR and release gate (benger-extended issue #193): lint plus the smoke
# suites, a critical-flow subset of the API, workers and Jest suites (each
# listed in its smoke manifest, see `make test-smoke`). It runs on every PR
# into dev (day-to-day work) and main (releases), and on pushes to main, where
# a green gate dispatches the core-updated event that triggers the extended
# repo's build + prod deploy. The one bypass is the manual notify-extended.yml,
# for emergencies.
#
# The full suites, the coverage floors and the Playwright E2E run every night
# (nightly-tests.yml, nightly-coverage.yml), and run locally before a PR. A
# risky change can run the full suites here on demand, with no deploy:
#   gh workflow run ci.yml --ref <branch> -f full=true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full API, workers and Jest suites instead of the smoke suites
        type: boolean
        default: false

# A PR's newer push cancels its older run. Everything else is grouped by ref,
# so a manual dispatch on another branch never replaces a pending main run
# (which would drop that commit's downstream dispatch).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: cd services/frontend && npm ci --no-audit

      # The tree was reformatted in one commit (see .git-blame-ignore-revs);
      # this keeps it that way. `npx prettier --write .` fixes a red run.
      - name: Prettier format check
        run: cd services/frontend && npx prettier --check .

      # Errors fail the job and warnings stay advisory.
      - name: ESLint
        run: cd services/frontend && npx eslint src e2e --quiet

      # The app tsconfig excludes e2e, so the specs were never type-checked.
      - name: Type-check e2e specs
        run: cd services/frontend && npx tsc -p e2e/tsconfig.json

  frontend-tests:
    # Smoke: the suites in services/frontend/smoke_manifest.txt. Full (a
    # dispatch with full=true): all 777 suites in three shards, ~5 min each;
    # Jest's --shard splits by suite, deterministically. Coverage and its
    # thresholds run at night (make test-frontend in nightly-tests.yml).
    name: Frontend Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.full && '["1/3", "2/3", "3/3"]' || '["smoke"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        run: cd services/frontend && npm ci --no-audit

      - name: Run Jest smoke suite
        if: matrix.shard == 'smoke'
        run: make test-smoke-frontend

      - name: Run Jest tests (shard ${{ matrix.shard }})
        if: matrix.shard != 'smoke'
        run: |
          cd services/frontend && npm test -- --ci --passWithNoTests \
            --shard=${{ matrix.shard }} --coverage=false

  python-checks:
    name: Python Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff pyyaml

      - name: Lint API, Workers, Shared
        run: ruff check --select=F821,F823 --exclude="*/scripts/*" services/api/ services/workers/ services/shared/

      # The api and workers images install exactly services/<svc>/uv.lock
      # (`uv sync --locked` in the Dockerfiles). A pyproject.toml edit without
      # a matching `uv lock` would fail the image build late, in the extended
      # pipeline; catch it here instead. The second check fails when the
      # [tool.uv] constraint blocks drift from
      # services/shared/dependency-constraints.txt or the two locks resolve a
      # package both images install to different versions. Same uv as the
      # Dockerfiles.
      - name: Check uv lockfiles are current
        run: |
          pip install uv==0.11.28
          (cd services/api && uv lock --check)
          (cd services/workers && uv lock --check)
          python scripts/sync_shared_constraints.py --check

      # Publication scripts: ruff's default rules at the version pinned in
      # publications/ruff.toml (git-ignored WIP folders are skipped).
      - name: Lint publications
        run: pipx run ruff==0.16.9 check publications/

      # Python API client (clients/python): mock-transport tests, no network.
      # Same pinned ruff as publications (clients/python/pyproject.toml).
      # scripts/tests covers the repo scripts the gate itself relies on
      # (check_smoke.py); stdlib only, so it runs here.
      - name: Lint + test Python client and repo scripts
        run: |
          pipx run ruff==0.16.9 check clients/python/ scripts/check_smoke.py scripts/tests/
          pip install httpx pytest
          python -m pytest -q clients/python/tests scripts/tests

      # Every Celery queue must be consumed by exactly one worker pool. A
      # stranded queue fails silently in production -- tasks just never run --
      # so it is checked here, on a runner that has the Helm chart. The workers
      # pytest container only mounts services/workers + services/shared.
      - name: Check Celery queue <-> worker-pool contract
        run: python services/workers/scripts/check_celery_queue_pools.py

      # The workers app image builds FROM a CONTENT tag of workers-base, and
      # build-workers-base.yml publishes that tag. Bumping only the workflow
      # side is SILENT: the new base lands on a tag nothing consumes and the
      # app keeps building on the previous one, green all the way to a deploy.
      # Same reason as the queue check above -- needs the repo root, which the
      # workers pytest container does not have.
      - name: Check workers-base tag lockstep
        run: python services/api/scripts/check_workers_base_tag.py

  # Dockerized pytest suites. Smoke: the tests in each service's
  # tests/smoke_manifest.txt (make test-smoke-api / test-smoke-workers), which
  # cover app boot, migrations to head on real Postgres, login and org scope,
  # project create/list, import, generation and evaluation dispatch, dashboard
  # stats and the extension handshake. Full (a dispatch with full=true): the
  # whole API suite in five alphabetical shards and the workers suite; globs
  # expand inside the test container, so new test files land in a shard
  # automatically.
  #
  # Each job starts only Postgres + Redis. The pytest suites never talk to the
  # API container, the Celery worker, MinIO or the frontend: the runners build
  # their schema from the models and use STORAGE_TYPE=local. The complete
  # stack is built for the Playwright E2E run in nightly-tests.yml.
  python-tests:
    name: ${{ matrix.shard }} tests
    runs-on: ubuntu-latest
    # The limit only catches a hung run.
    timeout-minutes: ${{ inputs.full && 15 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.full && '["api-unit-al", "api-unit-mz", "api-integration-al", "api-integration-mz", "api-rest", "workers"]' || '["api-smoke", "workers-smoke"]') }}
    env:
      SUITE: ${{ startsWith(matrix.shard, 'workers') && 'workers' || 'api' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The workers runner image builds FROM the multi-GB workers-base image
      # (torch + ML models, 5.7 GB unpacked, ~10 GB at the peak of the pull),
      # so both workers jobs (smoke and full) need the room. The rm -rf takes
      # about 2.5 minutes, longer than the whole rest of the smoke job, so it
      # only runs when / has less than twice that peak free; df shows which.
      - name: Free disk space
        if: env.SUITE == 'workers'
        run: |
          df -h /
          FREE_GB=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          if [ "$FREE_GB" -ge 20 ]; then
            echo "$FREE_GB GB free on /, enough for the workers-base image; nothing removed."
            exit 0
          fi
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/share/chromium || true
          df -h /

      # Not waited for here: `compose run` below waits until both are
      # healthy, so they come up while the runner image builds.
      - name: Start Postgres + Redis
        run: docker compose -f infra/docker-compose.test.yml up -d test-db test-redis

      # API runner image: built with buildx and the GitHub Actions cache, so
      # the apt + uv dependency layers come from the cache and only the
      # `COPY . .` layer is rebuilt per run. All api jobs share one cache
      # scope (nightly-coverage.yml too); the first to finish writes it
      # (ignore-error keeps concurrent writers from failing a job). The image
      # is loaded into the local daemon under the name compose gives the
      # service by default (<project>-<service>, project `benger-test` from
      # the compose file), so `make test-api` finds it and does not build
      # again. If that name ever drifts, compose simply builds the image
      # itself (slower, still correct).
      - name: Set up Docker Buildx
        if: env.SUITE == 'api'
        uses: docker/setup-buildx-action@v4

      - name: Build API test runner image (GHA layer cache)
        id: api-image
        if: env.SUITE == 'api'
        # One retry below absorbs a transient PyPI/apt/registry error.
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: services/api
          file: services/api/Dockerfile
          # The runner stage: production image + the `test` extra, as root
          # (the compose file's test-api-runner uses the same target). The
          # Dockerfile's last stage is the non-root production image, which
          # has no pytest.
          target: test
          load: true
          push: false
          tags: benger-test-test-api-runner:latest
          cache-from: type=gha,scope=api-test-runner
          cache-to: type=gha,mode=max,scope=api-test-runner,ignore-error=true

      - name: Build API test runner image (retry)
        if: env.SUITE == 'api' && steps.api-image.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: services/api
          file: services/api/Dockerfile
          target: test
          load: true
          push: false
          tags: benger-test-test-api-runner:latest
          cache-from: type=gha,scope=api-test-runner

      # Workers runner image: a plain compose build. Its only expensive part
      # is pulling the workers-base image from GHCR, which a layer cache
      # cannot avoid (base layers are pulled, not cached), and exporting a
      # multi-GB image out of a buildx builder with load: true would cost
      # more than the cache saves. Retried once for transient pull errors.
      - name: Build workers test runner image
        if: env.SUITE == 'workers'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 2
          retry_wait_seconds: 30
          command: make test-build-runners RUNNERS=workers

      - name: Run ${{ matrix.shard }} tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          START=$SECONDS
          case "$SHARD" in
            api-smoke)          make test-smoke-api; BUDGET=1 ;;
            workers-smoke)      make test-smoke-workers; BUDGET=1 ;;
            api-unit-al)        make test-api FILE="tests/unit/test_[a-l]*.py"; BUDGET=5 ;;
            api-unit-mz)        make test-api FILE="tests/unit/test_[m-z]*.py"; BUDGET=5 ;;
            api-integration-al) make test-api FILE="tests/integration/test_[a-l]*.py"; BUDGET=5 ;;
            api-integration-mz) make test-api FILE="tests/integration/test_[m-z]*.py"; BUDGET=5 ;;
            api-rest)           make test-api FILE="tests/ --ignore=tests/unit --ignore=tests/integration"; BUDGET=5 ;;
            workers)            make test-workers-gate; BUDGET=5 ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          MINUTES=$(( (SECONDS - START) / 60 ))
          if [ "$MINUTES" -ge "$BUDGET" ]; then
            echo "::warning::$SHARD took $MINUTES min of tests alone, above its $BUDGET min budget"
          fi

      - name: Cleanup
        if: always()
        run: |
          make test-stop 2>/dev/null || true
          docker image prune -f || true

  # NOTE: the API coverage ratchet (issue #33) is NOT a per-merge gate.
  # Thread-accurate coverage (.coveragerc concurrency=thread) is ~3x slower,
  # so it runs in the nightly workflow (.github/workflows/nightly-coverage.yml),
  # which shards the suite with COVERAGE=1 and enforces API_COVERAGE_FLOOR.

  # Cross-repo dispatch: tells the private extended repo to rebuild against
  # this commit and deploy to production. Fires only on push to main, and
  # only when every gate job passed.
  #
  # The one bypass: `gh workflow run notify-extended.yml` dispatches immediately
  # with no CI at all (emergencies / re-deploys).
  #
  # The downstream repo is named via the EXTENDED_REPO secret (owner/repo)
  # and EXTENDED_REPO_NAME secret (repo name, used as the App token scope)
  # so the public workflow YAML does not hard-code the private repo path.
  # Required secrets (org or repo level):
  #   APP_ID, APP_PRIVATE_KEY     — GitHub App with read+dispatch on the target
  #   EXTENDED_REPO               — full owner/repo, e.g. "owner/private-edition"
  #   EXTENDED_REPO_NAME          — just the repo name, e.g. "private-edition"
  # If any of those secrets is unset, the job no-ops with a warning rather
  # than failing the run, so a fresh public clone without secrets still
  # passes CI.
  notify-extended:
    name: Trigger downstream rebuild
    needs: [frontend-lint, frontend-tests, python-checks, python-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip if downstream not configured
        id: gate
        env:
          EXTENDED_REPO: ${{ secrets.EXTENDED_REPO }}
        run: |
          if [ -z "$EXTENDED_REPO" ]; then
            echo "EXTENDED_REPO secret not set — skipping cross-repo dispatch."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate token
        if: steps.gate.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ secrets.EXTENDED_REPO_NAME }}

      - name: Dispatch rebuild
        if: steps.gate.outputs.configured == 'true'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ secrets.EXTENDED_REPO }}
          event-type: core-updated
          # The extended build checks out the platform at exactly this SHA,
          # so the deployed artifact always matches the commit that passed
          # the gate — not whatever main happens to be at build time.
          client-payload: '{"platform_sha": "${{ github.sha }}"}'
