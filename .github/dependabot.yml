version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastiannagl"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # "uv" (not "pip"): the images install from uv.lock, so an update has to
  # change the lock together with pyproject.toml or CI's `uv lock --check`
  # fails. Packages bounded in services/shared/dependency-constraints.txt must
  # move in both services at once, which Dependabot cannot do, so they are
  # ignored here (generated block) and bumped by hand in that file.
  - package-ecosystem: "uv"
    directory: "/services/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastiannagl"
    groups:
      pip-api-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # BEGIN shared constraints (generated by scripts/sync_shared_constraints.py, do not edit)
      - dependency-name: "sqlalchemy"
      - dependency-name: "psycopg2-binary"
      - dependency-name: "asyncpg"
      - dependency-name: "pydantic"
      - dependency-name: "jsonschema"
      - dependency-name: "celery"
      - dependency-name: "kombu"
      - dependency-name: "redis"
      - dependency-name: "boto3"
      - dependency-name: "botocore"
      - dependency-name: "httpx"
      - dependency-name: "aiohttp"
      - dependency-name: "requests"
      - dependency-name: "pyjwt"
      - dependency-name: "cryptography"
      - dependency-name: "python-jose"
      - dependency-name: "jinja2"
      - dependency-name: "pyyaml"
      - dependency-name: "python-dotenv"
      - dependency-name: "numpy"
      - dependency-name: "scipy"
      - dependency-name: "openai"
      - dependency-name: "anthropic"
      - dependency-name: "google-genai"
      - dependency-name: "tiktoken"
      - dependency-name: "ijson"
      - dependency-name: "zstandard"
      - dependency-name: "stripe"
      # END shared constraints

  # "uv" (not "pip"): the images install from uv.lock, so an update has to
  # change the lock together with pyproject.toml or CI's `uv lock --check`
  # fails. Packages bounded in services/shared/dependency-constraints.txt must
  # move in both services at once, which Dependabot cannot do, so they are
  # ignored here (generated block) and bumped by hand in that file.
  - package-ecosystem: "uv"
    directory: "/services/workers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastiannagl"
    groups:
      pip-workers-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # BEGIN shared constraints (generated by scripts/sync_shared_constraints.py, do not edit)
      - dependency-name: "sqlalchemy"
      - dependency-name: "psycopg2-binary"
      - dependency-name: "asyncpg"
      - dependency-name: "pydantic"
      - dependency-name: "jsonschema"
      - dependency-name: "celery"
      - dependency-name: "kombu"
      - dependency-name: "redis"
      - dependency-name: "boto3"
      - dependency-name: "botocore"
      - dependency-name: "httpx"
      - dependency-name: "aiohttp"
      - dependency-name: "requests"
      - dependency-name: "pyjwt"
      - dependency-name: "cryptography"
      - dependency-name: "python-jose"
      - dependency-name: "jinja2"
      - dependency-name: "pyyaml"
      - dependency-name: "python-dotenv"
      - dependency-name: "numpy"
      - dependency-name: "scipy"
      - dependency-name: "openai"
      - dependency-name: "anthropic"
      - dependency-name: "google-genai"
      - dependency-name: "tiktoken"
      - dependency-name: "ijson"
      - dependency-name: "zstandard"
      - dependency-name: "stripe"
      # END shared constraints

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    reviewers:
      - "sebastiannagl"
    groups:
      gha-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
