version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/services/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastiannagl"
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # "uv" (not "pip"): the images install from uv.lock, so an update has to
  # change the lock together with pyproject.toml or CI's `uv lock --check`
  # fails. Bounds shared with the other service live in
  # services/shared/dependency-constraints.txt; a bump past one of those needs
  # a manual edit there.
  - package-ecosystem: "uv"
    directory: "/services/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastiannagl"
    groups:
      pip-api-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # SQLAlchemy 2.1 resolves postgresql:// to psycopg 3; the sync engine
      # ships psycopg2 only. Drop once the API moves off psycopg2.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]

  # "uv" (not "pip"): the images install from uv.lock, so an update has to
  # change the lock together with pyproject.toml or CI's `uv lock --check`
  # fails. Bounds shared with the other service live in
  # services/shared/dependency-constraints.txt; a bump past one of those needs
  # a manual edit there.
  - package-ecosystem: "uv"
    directory: "/services/workers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    reviewers:
      - "sebastiannagl"
    groups:
      pip-workers-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Same psycopg 3 switch as the api; workers ship psycopg2 only.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    reviewers:
      - "sebastiannagl"
    groups:
      gha-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
