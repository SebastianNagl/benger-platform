apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.workers.name }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.workers.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.workers.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: workers
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
spec:
  {{- if not .Values.workers.autoscaling.enabled }}
  replicas: {{ .Values.workers.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.workers.deploymentStrategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.workers.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.workers.name }}
    spec:
      {{- include "benger.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: {{ .Values.workers.name }}
          image: "{{ .Values.workers.image.repository }}:{{ .Values.workers.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          # THE BULK POOL. The -Q list moved into values.yaml (workers.queues)
          # so the queue<->pool contract is parseable by
          # services/workers/scripts/check_celery_queue_pools.py, which asserts
          # every queue in celery_queues.QUEUES has exactly one consuming pool.
          # `-n bulk@%h` fixes the nodename so the probes below can scope to
          # this pod (a bare `inspect ping` broadcasts to every worker on the
          # broker and passes whenever ANY of them replies).
          command: ["celery", "-A", "tasks", "worker", "--loglevel=info", "-n", "bulk@%h", "--concurrency={{ .Values.workers.concurrency | default 4 }}", "--prefetch-multiplier={{ .Values.workers.prefetchMultiplier | default 1 }}", "--max-tasks-per-child={{ .Values.workers.maxTasksPerChild | default 50 }}", "-Q", "{{ join "," .Values.workers.queues }}"]
          # Explicit empty args prevents server-side apply from preserving
          # an `args:` array set out-of-band via `kubectl patch`. Without
          # this, the container ran command + args (the same celery
          # invocation duplicated), failing with "-A as worker option".
          args: []
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "celery -A tasks inspect ping -d bulk@$HOSTNAME --timeout=15"
            initialDelaySeconds: 240
            periodSeconds: 90
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "celery -A tasks inspect ping -d bulk@$HOSTNAME --timeout=10"
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 5
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "python -c 'from tasks import app; print(\"Celery app initialized\")'"
            initialDelaySeconds: 90
            periodSeconds: 20
            # 120s (was 15s): `from tasks import app` now imports lazily (~1.7s,
            # no neural ML — see workers/tests/test_tasks_import_lightness.py); the
            # generous timeout is a safety net so a slow first import can never
            # wedge a deploy.
            timeoutSeconds: 120
            failureThreshold: 30
          env:
            {{- range .Values.workers.env }}
            - name: {{ .name }}
              {{- if .value }}
              {{- if eq .name "FRONTEND_URL" }}
              value: {{ tpl .value $ | quote }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
              {{- else if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
            {{- if .Values.minio.enabled }}
            {{- include "benger.storageEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.workers.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
---
{{- if .Values.workers.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-{{ .Values.workers.name }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.workers.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.workers.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: workers
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-{{ .Values.workers.name }}
  minReplicas: {{ .Values.workers.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.workers.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.workers.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.workers.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
{{- end }} 