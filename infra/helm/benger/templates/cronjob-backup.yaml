{{- /*
Nightly logical PostgreSQL backup (pg_dump, plain SQL, gzip).

Steps, all in one Job pod:
  1. `dump` (postgres image): pg_dump | gzip, checked while it streams (gzip
     stream decodes, at least 5 CREATE TABLE statements), optionally encrypted
     with age, written to the node hostPath (daily/, weekly/ on Sundays,
     monthly/ on the 1st), then the local retention policy is applied.
  2. `offsite` (mc image, only when backup.offsite.enabled): uploads the files
     step 1 wrote to an off-node S3 bucket. It runs as the main container with
     `dump` as its init container, so it only starts after a good dump.

Encryption (backup.encryption.enabled): the dump is encrypted to the age
public key(s) in Secret benger-backup-encryption, key `recipient` (one
recipient per line, `#` comments allowed, so a second escrow key can be
added). Only the public key is on the node; the private key stays offline
with the operators. Encrypted files end in `.sql.gz.age`. When encryption is
enabled and the Secret or key is missing the job fails with an explicit
error. `age` is installed at runtime with `apk add --no-cache age` from the
Alpine mirror (the postgres:18-alpine image does not ship it), so the job
needs outbound HTTPS to dl-cdn.alpinelinux.org; if the mirror is down the
job fails loudly rather than writing a plaintext dump. To avoid the runtime
install, point backup.image at an image that already has age on PATH; the
script skips the install when `age` is found.

Offsite upload refuses to render without encryption: a plaintext dump never
leaves the node.

RESTORE (on an operator machine that holds the age private key):
  1. Fetch the file, from the node hostPath
       scp root@<node>:/opt/benger-backups/daily/benger_db_backup_<date>.sql.gz.age .
     or from the offsite bucket
       mc cp offsite/<bucket>/<prefix>/daily/benger_db_backup_<date>.sql.gz.age .
  2. Decrypt and decompress (stdout only, so plaintext never lands on disk)
       age -d -i ~/benger-backup-key.txt benger_db_backup_<date>.sql.gz.age | gunzip > /dev/null
     (dry run that proves the key and archive are good), then restore into an
     EMPTY database. The dump is plain SQL made with --no-owner --no-acl, so
     it is replayed with psql, not pg_restore:
       createdb -h <host> -U postgres benger_restore
       age -d -i ~/benger-backup-key.txt benger_db_backup_<date>.sql.gz.age \
         | gunzip | psql -h <host> -U postgres -d benger_restore -v ON_ERROR_STOP=1
     In the cluster, the easiest target is the postgresql pod itself:
       age -d -i key.txt <file>.sql.gz.age | gunzip \
         | kubectl -n <ns> exec -i <release>-postgresql-0 -- \
             env PGPASSWORD=<pw> psql -U postgres -d benger_restore -v ON_ERROR_STOP=1
  3. Check row counts against expectations, then switch over: scale api,
     workers, pools and beat to 0, rename the databases
     (ALTER DATABASE benger RENAME TO benger_old; ALTER DATABASE benger_restore
     RENAME TO benger;), scale back up. The api's startup migration runner
     brings an older dump to the current alembic head.
  Unencrypted files (`.sql.gz`, encryption disabled) skip the age step:
       gunzip -c <file>.sql.gz | psql ... -v ON_ERROR_STOP=1
*/ -}}
{{- if .Values.backup.enabled }}
{{- $enc := .Values.backup.encryption | default dict }}
{{- $off := .Values.backup.offsite | default dict }}
{{- if and $off.enabled (not $enc.enabled) }}
{{- fail "backup.offsite.enabled requires backup.encryption.enabled: a plaintext database dump must never leave the node" }}
{{- end }}
{{- $mc := .Values.minio.mcImage | default dict }}
{{- $offsiteImage := $off.image | default (printf "%s@%s" $mc.repository $mc.digest) }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-backup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.backup.timeoutSeconds | default 1800 }}
      backoffLimit: {{ .Values.backup.backoffLimit | default 1 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Release.Name }}-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          # Runs as root by default (backup.securityContext in values.yaml):
          # the hostPath is root-owned and `apk add` writes to the image's
          # root-owned paths. Capabilities are still dropped, which root does
          # not need for files it owns.
          {{- include "benger.podSecurityContext" (dict "root" $ "component" .Values.backup.securityContext) | nindent 10 }}
          {{- if $off.enabled }}
          initContainers:
          {{- else }}
          containers:
          {{- end }}
            - name: dump
              image: {{ .Values.backup.image | default "postgres:18-alpine" | quote }}
              imagePullPolicy: IfNotPresent
              {{- include "benger.containerSecurityContext" (dict "root" $ "component" .Values.backup.securityContext) | nindent 14 }}
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: benger-postgres-credentials
                      key: host
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: benger-postgres-credentials
                      key: port
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: benger-postgres-credentials
                      key: username
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: benger-postgres-credentials
                      key: database
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: benger-postgres-credentials
                      key: password
                - name: BACKUP_DIR
                  value: /backups
                - name: RETENTION_DAILY
                  value: {{ .Values.backup.retention.daily | default 7 | quote }}
                - name: RETENTION_WEEKLY
                  value: {{ .Values.backup.retention.weekly | default 4 | quote }}
                - name: RETENTION_MONTHLY
                  value: {{ .Values.backup.retention.monthly | default 6 | quote }}
                - name: BACKUP_ENCRYPT
                  value: {{ ternary "true" "false" (eq (toString $enc.enabled) "true") | quote }}
                {{- if $enc.enabled }}
                # optional so a missing Secret reaches the script, which fails
                # with a clear message instead of the pod hanging in
                # CreateContainerConfigError until the deadline.
                - name: AGE_RECIPIENTS
                  valueFrom:
                    secretKeyRef:
                      name: {{ $enc.secretName | default "benger-backup-encryption" }}
                      key: {{ $enc.secretKey | default "recipient" }}
                      optional: true
                {{- end }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  set -o pipefail
                  # Nothing this job writes is readable by other node users.
                  umask 077

                  DATE=$(date +%Y-%m-%d_%H-%M-%S)
                  DAY_OF_WEEK=$(date +%u)
                  DAY_OF_MONTH=$(date +%d)

                  DAILY_DIR="${BACKUP_DIR}/daily"
                  WEEKLY_DIR="${BACKUP_DIR}/weekly"
                  MONTHLY_DIR="${BACKUP_DIR}/monthly"
                  HANDOFF_DIR=/handoff

                  mkdir -p "${DAILY_DIR}" "${WEEKLY_DIR}" "${MONTHLY_DIR}"
                  chmod 700 "${DAILY_DIR}" "${WEEKLY_DIR}" "${MONTHLY_DIR}"

                  if [ "${BACKUP_ENCRYPT}" = "true" ]; then
                    if [ -z "${AGE_RECIPIENTS:-}" ]; then
                      echo "[$(date)] ERROR: backup.encryption.enabled=true but Secret benger-backup-encryption (key 'recipient') is missing or empty. No backup written."
                      exit 1
                    fi
                    if ! command -v age >/dev/null 2>&1; then
                      echo "[$(date)] Installing age (apk add --no-cache age)..."
                      if ! apk add --no-cache age >/tmp/apk.log 2>&1; then
                        cat /tmp/apk.log
                        echo "[$(date)] ERROR: could not install age. No backup written."
                        exit 1
                      fi
                    fi
                    printf '%s\n' "${AGE_RECIPIENTS}" > /tmp/age-recipients
                    EXT="sql.gz.age"
                    echo "[$(date)] Encryption on ($(age --version))"
                  else
                    EXT="sql.gz"
                    echo "[$(date)] WARNING: encryption off, the dump is stored in plaintext"
                  fi

                  BACKUP_FILE="${DAILY_DIR}/benger_db_backup_${DATE}.${EXT}"
                  PARTIAL="${BACKUP_FILE}.partial"
                  FIFO=/tmp/dump-check.fifo
                  trap 'rm -f "${PARTIAL}" "${FIFO}"' EXIT

                  echo "[$(date)] Starting PostgreSQL backup..."
                  echo "[$(date)] Target: ${PGHOST}:${PGPORT}/${PGDATABASE}"

                  # Check the gzip stream while it is written (the encrypted
                  # file cannot be read back without the private key): a reader
                  # on a FIFO decompresses the same bytes and counts tables.
                  mkfifo "${FIFO}"
                  ( gunzip -c < "${FIFO}"; echo $? > /tmp/gunzip.rc ) | grep -c '^CREATE TABLE ' > /tmp/table.count &

                  if [ "${BACKUP_ENCRYPT}" = "true" ]; then
                    pg_dump --no-owner --no-acl | gzip | tee "${FIFO}" | age -R /tmp/age-recipients > "${PARTIAL}"
                  else
                    pg_dump --no-owner --no-acl | gzip | tee "${FIFO}" > "${PARTIAL}"
                  fi
                  wait || true

                  if [ "$(cat /tmp/gunzip.rc 2>/dev/null)" != "0" ]; then
                    echo "[$(date)] ERROR: Backup failed gzip integrity check!"
                    exit 1
                  fi
                  echo "[$(date)] Gzip integrity check passed"

                  if [ "${BACKUP_ENCRYPT}" = "true" ]; then
                    if [ "$(head -c 21 "${PARTIAL}")" != "age-encryption.org/v1" ]; then
                      echo "[$(date)] ERROR: output is not an age file!"
                      exit 1
                    fi
                  elif ! gunzip -t "${PARTIAL}"; then
                    echo "[$(date)] ERROR: written file failed gzip integrity check!"
                    exit 1
                  fi

                  LIVE_TABLE_COUNT=$(psql -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE';" | tr -d ' \n')
                  DUMP_TABLE_COUNT=$(cat /tmp/table.count 2>/dev/null || echo 0)

                  echo "[$(date)] Live database tables: ${LIVE_TABLE_COUNT}"
                  echo "[$(date)] Tables in dump: ${DUMP_TABLE_COUNT}"

                  if [ "${DUMP_TABLE_COUNT:-0}" -lt 5 ]; then
                    echo "[$(date)] ERROR: Dump contains fewer than 5 tables - backup may be incomplete!"
                    exit 1
                  fi

                  mv "${PARTIAL}" "${BACKUP_FILE}"
                  BACKUP_SIZE=$(du -h "${BACKUP_FILE}" | cut -f1)
                  echo "[$(date)] Backup created: ${BACKUP_FILE} (${BACKUP_SIZE})"
                  CREATED="${BACKUP_FILE}"

                  # Weekly: copy Sunday's backup
                  if [ "${DAY_OF_WEEK}" = "7" ]; then
                    WEEKLY_FILE="${WEEKLY_DIR}/benger_db_backup_weekly_${DATE}.${EXT}"
                    cp "${BACKUP_FILE}" "${WEEKLY_FILE}"
                    CREATED="${CREATED} ${WEEKLY_FILE}"
                    echo "[$(date)] Weekly backup promoted: ${WEEKLY_FILE}"
                  fi

                  # Monthly: copy 1st-of-month backup
                  if [ "${DAY_OF_MONTH}" = "01" ]; then
                    MONTHLY_FILE="${MONTHLY_DIR}/benger_db_backup_monthly_${DATE}.${EXT}"
                    cp "${BACKUP_FILE}" "${MONTHLY_FILE}"
                    CREATED="${CREATED} ${MONTHLY_FILE}"
                    echo "[$(date)] Monthly backup promoted: ${MONTHLY_FILE}"
                  fi

                  # Hand the new files to the offsite container (if any).
                  if [ -d "${HANDOFF_DIR}" ]; then
                    for f in ${CREATED}; do echo "$f"; done > "${HANDOFF_DIR}/files"
                  fi

                  # Retention cleanup (plaintext .sql.gz and encrypted .sql.gz.age
                  # alike; stale .partial files from a killed run go after a day).
                  echo "[$(date)] Applying retention policy..."
                  find "${DAILY_DIR}" -name "benger_db_backup_*.sql.gz*" -mtime +${RETENTION_DAILY} -delete 2>/dev/null || true
                  find "${WEEKLY_DIR}" -name "benger_db_backup_weekly_*.sql.gz*" -mtime +$((RETENTION_WEEKLY * 7)) -delete 2>/dev/null || true
                  find "${MONTHLY_DIR}" -name "benger_db_backup_monthly_*.sql.gz*" -mtime +$((RETENTION_MONTHLY * 30)) -delete 2>/dev/null || true
                  find "${BACKUP_DIR}" -name "*.partial" -mtime +1 -delete 2>/dev/null || true

                  DAILY_COUNT=$(find "${DAILY_DIR}" -name "*.sql.gz*" | wc -l | tr -d ' ')
                  WEEKLY_COUNT=$(find "${WEEKLY_DIR}" -name "*.sql.gz*" | wc -l | tr -d ' ')
                  MONTHLY_COUNT=$(find "${MONTHLY_DIR}" -name "*.sql.gz*" | wc -l | tr -d ' ')
                  TOTAL_SIZE=$(du -sh "${BACKUP_DIR}" | cut -f1)

                  echo "[$(date)] Backup complete: daily=${DAILY_COUNT}, weekly=${WEEKLY_COUNT}, monthly=${MONTHLY_COUNT}, total_size=${TOTAL_SIZE}"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                {{- if $off.enabled }}
                - name: handoff
                  mountPath: /handoff
                {{- end }}
              resources:
                requests:
                  memory: {{ (.Values.backup.resources).requests.memory | default "128Mi" | quote }}
                  cpu: {{ (.Values.backup.resources).requests.cpu | default "100m" | quote }}
                limits:
                  memory: {{ (.Values.backup.resources).limits.memory | default "512Mi" | quote }}
                  cpu: {{ (.Values.backup.resources).limits.cpu | default "500m" | quote }}
          {{- if $off.enabled }}
          containers:
            - name: offsite
              image: {{ $offsiteImage | quote }}
              imagePullPolicy: IfNotPresent
              {{- include "benger.containerSecurityContext" (dict "root" $ "component" .Values.backup.securityContext) | nindent 14 }}
              env:
                - name: MC_CONFIG_DIR
                  value: /tmp/.mc
                - name: RELEASE_NAMESPACE
                  value: {{ .Release.Namespace | quote }}
                # The S3_* refs are optional so a missing Secret or key reaches
                # the script, which fails with a clear message (prefix may be
                # absent and defaults to the namespace).
                {{- $offSecret := $off.secretName | default "benger-backup-offsite" }}
                {{- range $envName, $key := dict "S3_ENDPOINT" "endpoint" "S3_BUCKET" "bucket" "S3_ACCESS_KEY" "access-key" "S3_SECRET_KEY" "secret-key" "S3_PREFIX" "prefix" }}
                - name: {{ $envName }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $offSecret }}
                      key: {{ $key }}
                      optional: true
                {{- end }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  for v in S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY; do
                    eval "val=\${$v:-}"
                    if [ -z "$val" ]; then
                      echo "[$(date)] ERROR: backup.offsite.enabled=true but $v is empty: Secret benger-backup-offsite is missing or lacks a key (endpoint, bucket, access-key, secret-key). The local backup was written; nothing was uploaded."
                      exit 1
                    fi
                  done
                  if [ ! -s /handoff/files ]; then
                    echo "[$(date)] ERROR: the dump step handed over no files."
                    exit 1
                  fi
                  # Default prefix: the namespace, so prod/staging/demo never
                  # share keys in one bucket.
                  PREFIX="${S3_PREFIX:-${RELEASE_NAMESPACE}}"
                  PREFIX="${PREFIX%/}"
                  mc alias set offsite "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" >/dev/null
                  while read -r f; do
                    case "$f" in
                      *.age) ;;
                      *) echo "[$(date)] ERROR: refusing to upload unencrypted $f"; exit 1 ;;
                    esac
                    rel="${f#/backups/}"
                    dest="offsite/${S3_BUCKET}/${PREFIX}/${rel}"
                    mc cp --quiet "$f" "$dest" >/dev/null
                    local_size=$(wc -c < "$f" | tr -d ' ')
                    # The mc image has no grep/sed/awk: pull "size":N out of
                    # the JSON with shell parameter expansion.
                    stat_json=$(mc stat --json "$dest" 2>/dev/null || true)
                    remote_size=""
                    case "$stat_json" in
                      *'"size":'*)
                        rest="${stat_json#*\"size\":}"
                        remote_size="${rest%%[!0-9]*}"
                        ;;
                    esac
                    if [ "${remote_size:-}" != "${local_size}" ]; then
                      echo "[$(date)] ERROR: size mismatch for $dest (local ${local_size}, remote ${remote_size:-none})"
                      exit 1
                    fi
                    echo "[$(date)] Uploaded $dest (${local_size} bytes)"
                  done < /handoff/files
                  echo "[$(date)] Offsite upload complete"
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                  readOnly: true
                - name: handoff
                  mountPath: /handoff
                  readOnly: true
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
          {{- end }}
          volumes:
            - name: backup-storage
              hostPath:
                path: {{ .Values.backup.hostPath | default "/opt/benger-backups" }}
                type: DirectoryOrCreate
            {{- if $off.enabled }}
            - name: handoff
              emptyDir:
                sizeLimit: 1Mi
            {{- end }}
{{- end }}
