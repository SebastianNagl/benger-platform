{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app: {{ .Release.Name }}-{{ .Values.api.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.api.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
  annotations:
    {{- if .Values.middleware.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-api-chain@kubernetescrd
    {{- end }}
    {{- with .Values.api.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.api.ingress.tls }}
  tls:
    {{- range .Values.api.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.api.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-{{ $.Values.api.name }}
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
---
{{- if .Values.frontend.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    app: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
  annotations:
    {{- if .Values.middleware.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-frontend-chain@kubernetescrd
    {{- end }}
    {{- with .Values.frontend.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.frontend.ingress.tls }}
  tls:
    {{- range .Values.frontend.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.frontend.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-{{ $.Values.frontend.name }}
                port:
                  number: {{ $.Values.frontend.service.port }}
          {{- end }}
    {{- end }}
{{- $registerHosts := list }}
{{- range .Values.frontend.ingress.hosts }}
{{- if not (hasPrefix "*" .host) }}
{{- $registerHosts = append $registerHosts .host }}
{{- end }}
{{- end }}
{{- if and .Values.frontend.ingress.enabled $registerHosts }}
{{- $frontendPriority := index (.Values.frontend.ingress.annotations | default dict) "traefik.ingress.kubernetes.io/router.priority" | default "0" | int }}
{{- if ge $frontendPriority (include "benger.ltiRegisterPriority" . | int) }}
{{- fail "frontend.ingress router.priority must stay below the LTI registration priority (benger.ltiRegisterPriority)" }}
{{- end }}
---
# IMS LTI Dynamic Registration on the main host(s). Moodle's "Add LTI
# Advantage" shows /api/lti/register/init in an iframe, so this one path uses
# the frameable header chain (no X-Frame-Options; the API answer carries a
# CSP frame-ancestors for the LMS origin). Exact path, exact hosts only: a
# wildcard host at this priority would also catch other namespaces' hosts
# (staging.<domain>, demo.<domain>). TLS is the frontend Ingress's.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-lti-register
  labels:
    app: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
  annotations:
    traefik.ingress.kubernetes.io/router.priority: {{ include "benger.ltiRegisterPriority" . | quote }}
    {{- if .Values.middleware.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-lti-register-chain@kubernetescrd
    {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.frontend.ingress.tls }}
  tls:
    {{- range .Values.frontend.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $registerHosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api/lti/register/init
            pathType: Exact
            backend:
              service:
                name: {{ $.Release.Name }}-{{ $.Values.frontend.name }}
                port:
                  number: {{ $.Values.frontend.service.port }}
    {{- end }}
{{- end }}
{{- end }}
---
{{- if .Values.vertretbar.enabled }}
# vertretbar.net (prod) / staging.vertretbar.net (staging) → the SAME frontend
# service as the main host. The host is
# student-locked in the frontend and beta-locked by the vertretbar-chain middleware
# (BasicAuth while vertretbar.betaAuth.enabled). Separate Ingress so the beta lock
# and TLS cert scope to this apex only — what-a-benger.net stays open and untouched.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-vertretbar
  labels:
    app: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "100"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-vertretbar-chain@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.vertretbar.host | quote }}
      secretName: {{ .Values.vertretbar.tlsSecretName }}
  rules:
    - host: {{ .Values.vertretbar.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-{{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.service.port }}
---
# /api/lti on the vertretbar host bypasses the beta BasicAuth (issue #61):
# Moodle's SERVER fetches /api/lti/jwks during grade-passback token calls and
# auto-POSTs launches — it can never answer a BasicAuth challenge. Safe by
# construction: login/launch/jwks authenticate via the LTI protocol itself
# (platform-signed one-time tokens; Stripe-webhook trust model) and the
# resource-link endpoints require a session cookie. Security headers stay on
# via the lti-chain; only the beta lock is skipped. Higher router priority
# wins over the gated catch-all above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-vertretbar-lti
  labels:
    app: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "110"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-vertretbar-lti-chain@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.vertretbar.host | quote }}
      secretName: {{ .Values.vertretbar.tlsSecretName }}
  rules:
    - host: {{ .Values.vertretbar.host | quote }}
      http:
        paths:
          - path: /api/lti
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-{{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.service.port }}
---
# IMS LTI Dynamic Registration on the vertretbar host: the one path an LMS
# frames (see the lti-register Ingress above). Beats vertretbar-lti (110) and
# swaps its chain for the frameable one. No beta BasicAuth either.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-vertretbar-lti-register
  labels:
    app: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/name: {{ .Release.Name }}-{{ .Values.frontend.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
  annotations:
    traefik.ingress.kubernetes.io/router.priority: {{ include "benger.ltiRegisterPriority" . | quote }}
    {{- if .Values.middleware.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-lti-register-chain@kubernetescrd
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.vertretbar.host | quote }}
      secretName: {{ .Values.vertretbar.tlsSecretName }}
  rules:
    - host: {{ .Values.vertretbar.host | quote }}
      http:
        paths:
          - path: /api/lti/register/init
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-{{ .Values.frontend.name }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
---
{{- if and .Values.minio.enabled .Values.minio.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    app: {{ .Release.Name }}-minio
    app.kubernetes.io/name: {{ .Release.Name }}-minio
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: benger
    app.kubernetes.io/managed-by: helm
  annotations:
    # Deliberately NO compression middleware chain: export artifacts are opaque
    # blobs (often already gzipped) and serving large objects via presigned URLs;
    # double-gzip wastes CPU and can break range/streamed downloads.
    {{- with .Values.minio.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ required "minio.publicHost is required when minio.enabled=true" .Values.minio.publicHost | quote }}
      secretName: {{ .Values.global.tlsSecretName }}
  rules:
    - host: {{ .Values.minio.publicHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-minio
                port:
                  number: 9000
{{- end }}
