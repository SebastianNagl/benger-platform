{{- /*
Wildcard cert for the environment's own apex: <domain> + *.<domain> (org
subdomains). One block for every environment — prod (what-a-benger.net),
staging (staging.what-a-benger.net), demo (demo.what-a-benger.net) — keyed on
global.domain / global.tlsSecretName instead of per-environment copies. Issued
via the Cloudflare DNS-01 issuer, the only way to get a wildcard.

Certificate names are kept per environment for continuity with the resources
cert-manager already owns (renaming would re-issue the prod cert for nothing).
*/ -}}
{{- $certName := ternary "benger-wildcard-tls" (printf "%s-wildcard-tls" .Release.Name) (eq .Values.global.environment "production") }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $certName }}
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ required "global.tlsSecretName is required" .Values.global.tlsSecretName }}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - {{ required "global.domain is required" .Values.global.domain | quote }}
  - {{ printf "*.%s" .Values.global.domain | quote }}
---
{{- if .Values.vertretbar.enabled }}
# Vertretbar branded apex served from this same release. Host is per-environment
# (prod: vertretbar.net; staging: staging.vertretbar.net; demo: demo.vertretbar.net)
# via the values overlays.
# Apex-only for the beta (HTTP-01 needs each dnsName's A record to resolve;
# www/wildcard can be added later). Issued by the same server-local
# letsencrypt-prod ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-vertretbar-tls
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.vertretbar.tlsSecretName }}
  # HTTP-01 issuer, NOT the Cloudflare DNS-01 one used for the *.what-a-benger.net
  # wildcard: vertretbar.net is a non-wildcard apex on external DNS (Namecheap),
  # so it validates via HTTP-01 (A record + Traefik) — no Cloudflare/DNS-API.
  issuerRef:
    name: {{ .Values.vertretbar.certIssuer | default "letsencrypt-prod-http01" }}
    kind: ClusterIssuer
  dnsNames:
  - {{ .Values.vertretbar.host | quote }}
{{- end }}
