global:
  environment: production
  # Use specific image tags for production deployments (e.g., commit hash or semantic version)
  # imageTag: "v1.2.3" # Override this value during deployment
  # Plain strings, NOT {name: ...} maps: the bitnami subcharts (postgresql,
  # redis) stringify map entries into bogus secret names ("map[name:...]").
  # That was latent while their images were public; the postgres image now
  # lives in private GHCR and must authenticate. The platform's own
  # templates accept both forms (see benger.imagePullSecrets helper).
  imagePullSecrets:
    - ghcr-secret
  domain: what-a-benger.net
  tlsSecretName: benger-tls

api:
  name: api
  # 2 replicas removes the SPOF — rolling restarts no longer cause downtime.
  # 4 uvicorn workers per replica matches the Dockerfile CMD. Both bumps are
  # safe now that main.py wraps `alembic upgrade` in a Postgres advisory lock
  # (the prior `workers: 1` comment was hiding that startup race).
  # Effective DB pool budget: 2 × 4 × (10 + 20) = 240 slots.
  replicaCount: 2
  workers: 4
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: ghcr.io/sebastiannagl/benger/api
    pullPolicy: IfNotPresent
    tag: latest
  service:
    type: ClusterIP
    port: 8000
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.priority: "200"
      # cert-manager annotation removed: using wildcard Certificate resource
      # in templates/certificates.yaml — no need for per-ingress cert provisioning
    hosts:
      - host: api.what-a-benger.net
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: benger-tls
        hosts:
          - api.what-a-benger.net
  resources:
    limits:
      cpu: 1000m
      memory: 3Gi
    requests:
      cpu: 200m
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  env:
    # API keys (public /api/v1 access, core 2.37). The pepper is optional:
    # create `kubectl -n <ns> create secret generic benger-api-key-pepper
    # --from-literal=pepper=$(openssl rand -hex 32)` once per namespace;
    # without it keys are hashed unpeppered (hash_version 1 either way).
    - name: API_KEY_PEPPER
      valueFrom:
        secretKeyRef: {name: benger-api-key-pepper, key: pepper, optional: true}
    - name: API_USAGE_IP_MODE
      value: "truncated"
    - name: API_USAGE_RETENTION_DAYS
      value: "400"
    - name: ENVIRONMENT
      value: "production"  # IMPORTANT: Must be 'production' for proper authentication
    - name: FRONTEND_URL
      value: "https://{{ .Values.global.domain }}"
    - name: DATABASE_URI
      valueFrom:
        secretKeyRef:
          name: benger-postgres-credentials
          key: uri
    - name: REDIS_URI
      valueFrom:
        secretKeyRef:
          name: benger-redis-credentials
          key: uri
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: benger-api-secrets
          key: secret_key
    # Same value, second name. auth_module.config reads either; docker
    # compose sets JWT_SECRET_KEY and helm historically only set
    # SECRET_KEY, so any module that read JWT_SECRET_KEY directly (e.g.
    # email_verification.py before 2026-05-19) silently fell back to a
    # hardcoded literal in prod. Mount under both names so the next
    # such helper can't slip back into the same gap.
    - name: JWT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: benger-api-secrets
          key: secret_key
    # Pinning the encryption key explicitly decouples it from SECRET_KEY
    # rotations. EncryptionService used to derive the Fernet key from
    # SECRET_KEY via PBKDF2 with a fixed salt — any change to SECRET_KEY
    # silently invalidated every previously stored API key (observed
    # 2026-05-08 with InvalidToken errors on user OpenAI/Google rows).
    - name: ENCRYPTION_KEY
      valueFrom:
        secretKeyRef:
          name: benger-api-secrets
          key: encryption_key
    # Schema validation mode for API (can be overridden for staging)
    - name: SCHEMA_VALIDATION_MODE
      value: "strict"
    # SendGrid configuration for production
    - name: SENDGRID_API_KEY
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: SENDGRID_API_KEY
          optional: true
    - name: EMAIL_FROM_ADDRESS
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: EMAIL_FROM_ADDRESS
          optional: true
    - name: EMAIL_FROM_NAME
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: EMAIL_FROM_NAME
          optional: true
    # Mail provider switch (services/shared/mailer/mail_client.py): "sendgrid"
    # (default) or "cloudflare". With cloudflare, mail from
    # CLOUDFLARE_EMAIL_DOMAINS (default: the EMAIL_FROM_ADDRESS domain) goes
    # through Cloudflare Email Sending, other brands stay on SendGrid.
    - name: EMAIL_PROVIDER
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: EMAIL_PROVIDER
          optional: true
    - name: CLOUDFLARE_EMAIL_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: CLOUDFLARE_EMAIL_API_TOKEN
          optional: true
    - name: CLOUDFLARE_ACCOUNT_ID
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: CLOUDFLARE_ACCOUNT_ID
          optional: true
    - name: CLOUDFLARE_EMAIL_DOMAINS
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: CLOUDFLARE_EMAIL_DOMAINS
          optional: true
    # Postmark: fallback for account-critical mail when Cloudflare rejects
    # (mailer/postmark_client.py). Unset token = no Postmark; the monthly
    # limit (default 100) matches the plan. Prod only: staging keeps no token
    # so it cannot spend the shared monthly budget.
    - name: POSTMARK_SERVER_TOKEN
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: POSTMARK_SERVER_TOKEN
          optional: true
    - name: POSTMARK_MONTHLY_LIMIT
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: POSTMARK_MONTHLY_LIMIT
          optional: true
    - name: EMAIL_ENABLED
      value: "true"
    - name: MAIL_ENABLED
      value: "true"
    # Auth cookies are host-only. Older releases scoped them to the apex
    # (the API to the first domain, the Next proxy re-scoped them to each
    # host family); login, refresh and logout send expiring copies for these
    # domains so browsers drop the old domain-wide cookies. Remove once the
    # refresh-token lifetime (REFRESH_TOKEN_EXPIRE_DAYS, 7 days) has passed
    # since the switch.
    - name: LEGACY_COOKIE_DOMAIN
      value: ".what-a-benger.net,.vertretbar.net"
    # Vertretbar student billing (extended). Secrets live in the
    # benger-billing-secrets Secret (pre-create per namespace, like
    # benger-email-config / benger-minio-credentials). optional:true so a
    # deploy without billing configured still boots — the billing surface
    # no-ops and the gate/metering simply don't run.
    - name: BILLING_PROVIDER
      value: "stripe"
    - name: VERTRETBAR_ORG_ID
      value: "06620390-5817-4bc8-b94f-efa0798d5026"  # prod Vertretbar org (seed post-deploy with this id)
    # Base URL of the student-only host. The api builds LMS tool URLs for
    # connections on that host from it (shared/public_hosts.py).
    - name: VERTRETBAR_FRONTEND_URL
      value: "https://vertretbar.net"
    - name: VERTRETBAR_FREE_GRADINGS_PER_WEEK
      value: "1"
    - name: VERTRETBAR_PER_GRADING_PRICE_CENTS
      value: "100"
    - name: VERTRETBAR_FLASHCARD_BILLABLE
      value: "false"
    - name: STRIPE_METER_EVENT_NAME
      value: "exam_grading"
    - name: STRIPE_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: benger-billing-secrets
          key: stripe_secret_key
          optional: true
    - name: STRIPE_WEBHOOK_SECRET
      valueFrom:
        secretKeyRef:
          name: benger-billing-secrets
          key: stripe_webhook_secret
          optional: true
    - name: STRIPE_PRICE_BASE
      valueFrom:
        secretKeyRef:
          name: benger-billing-secrets
          key: stripe_price_base
          optional: true
    - name: STRIPE_PRICE_METERED
      valueFrom:
        secretKeyRef:
          name: benger-billing-secrets
          key: stripe_price_metered
          optional: true

# Extension overlays (platform core 2.37). Each enabled entry becomes one
# package in BENGER_EXTENSIONS, in ascending `order`; the `required` ones
# form BENGER_REQUIRE_EXTENSIONS. Both env vars are rendered into the api,
# the bulk workers, every worker pool and beat (benger.overlayEnv in
# templates/_helpers.tpl), after {api,workers}.extraEnv, so an overlay's
# value wins when a name appears in both. `api.env` / `workers.env` hold the
# overlay's own env entries (k8s EnvVar shape) for that role.
#
# When the map is empty nothing is rendered and the registry's default
# (benger_extended, required only via the legacy BENGER_REQUIRE_EXTENDED in
# extraEnv) applies. When ANY overlay is enabled the map is the complete list:
# an edition that still needs benger_extended has to declare it here too
# (the extended values file, order 10) or the package is no longer loaded.
#
# Shape:
#   overlays:
#     compliance:
#       enabled: true
#       package: benger_compliance   # default: benger_<name>
#       required: true               # default: false
#       order: 20                    # default: 100; lower loads first
#       api:
#         env: []                    # k8s EnvVar entries for the api
#       workers:
#         env: []                    # ... for workers, pools and beat
overlays: {}

workers:
  name: workers
  # THE BULK POOL. Long, memory-hungry work only. User-blocking tasks live on
  # the `workerPools` entries below so they can never queue behind a generation
  # run or a 6940-cell evaluation chord.
  #
  # Queue names are a contract with services/shared/celery_queues.py: every name
  # in celery_queues.QUEUES must appear in exactly one pool's list here, or its
  # messages strand with no consumer. services/workers/scripts/
  # check_celery_queue_pools.py parses this file and asserts exactly that; it
  # runs in the "Python Lint" CI job and via `make check-queue-pools`.
  # (The drain-only `default` queue was removed 2026-07-30 once its Redis list
  # hit 0 in both namespaces — issue #286.)
  queues: [generation, evaluation, bulk]
  replicaCount: 2
  # Concurrency = number of cell-eval forks per worker pod. Each fork that
  # loads embedding evaluators (BERTScore + MoverScore + sentence-
  # transformers) reaches ~1.5–2 GB RSS; even an llm_judge-only run grows
  # well past the bare ~600 MB of weights once tokenizer caches +
  # SQLAlchemy buffers + Python overhead are counted.
  #
  # The per-cell fan-out (PR #94) already parallelizes evaluation across
  # cells, so concurrency is NOT the throughput lever it looks like —
  # raising it only multiplies peak memory.
  #
  # History on the single 22 Gi node: 2026-05-31 the live deploy was
  # hand-patched to concurrency=8 / 18Gi and kernel-OOM-cascaded the node,
  # taking api + redis down with 503s. Reverting to concurrency=4 with a
  # 6Gi×2 shape STILL OOM-restarted a worker mid-run on an llm_judge-only
  # ZJS Fälle run, and acks_late requeue fanned that restart into a
  # cascade across both replicas. concurrency=2 caps one pod's peak
  # (~3–4 GB under embedding load) safely under the 6Gi limit; 2 replicas
  # × 6Gi = 12 Gi fits the node with room for api/pg/redis. For more
  # throughput add a node or replica — never raise concurrency or memory
  # past what one node's RAM can hold. A future change can auto-tune
  # concurrency from the config's metric set at orchestrator dispatch.
  concurrency: 2
  # Recycle each worker process after this many tasks so leaked memory
  # (SQLAlchemy sessions, response buffers, per-task allocations that
  # aren't freed) is reclaimed instead of accumulating until OOM. Before
  # 2026-05-31 there was no recycling and the worker grew unbounded toward
  # its limit. 20 keeps recycling aggressive enough to hold the leak well
  # under the 6Gi limit; raising it lets peak drift back up under embedding
  # loads.
  maxTasksPerChild: 20
  # Seconds the kubelet waits after SIGTERM before SIGKILL (audit E9). Celery's
  # warm shutdown finishes the running tasks; killed mid-task, an acks_late
  # evaluation cell only comes back after the 7200 s Redis visibility timeout
  # and the judge calls it already made are lost (and billed again). Pools in
  # workerPools inherit this value unless they set their own
  # `terminationGracePeriodSeconds`. A pod with no running task exits at once,
  # so a long grace only slows rollouts that interrupt real work. Mind the
  # memory: during a rollout the terminating pod keeps its RAM for up to this
  # long while the surge pod starts.
  terminationGracePeriodSeconds: 600
  # Hugging Face model cache (audit E10). The worker image bakes the embedding
  # models into /opt/hf at build time; HF_HOME points the libraries there and
  # HF_HUB_OFFLINE=1 forbids any runtime download, so a pod start never
  # depends on huggingface.co and never writes model files at runtime.
  # Rendered for the bulk pool and every workerPools entry (a pool may set its
  # own `modelCache` keys, e.g. `enabled: false`). Skipped per name when
  # workers.env, workers.extraEnv, the pool's extraEnv or an overlay already
  # sets HF_HOME / HF_HUB_OFFLINE, so it never renders a duplicate env name.
  # Set offline: false only for an image built without the baked cache.
  modelCache:
    enabled: true
    hfHome: /opt/hf
    offline: true
  # Pod/container securityContext override for the bulk pool, beat and (unless
  # a pool sets its own) the workerPools; same shape as the top-level
  # `securityContext` block. Empty = inherit the baseline.
  securityContext: {}
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  image:
    repository: ghcr.io/sebastiannagl/benger/workers
    pullPolicy: IfNotPresent
    tag: latest
  resources:
    # Sized together with `concurrency` above, not independently. Each fork
    # under embedding load peaks ~1.5–2 GB; with concurrency=2 a pod's worst
    # case is ~3–4 GB, which sits safely under a 6Gi limit (headroom for
    # tokenizer caches + SQLAlchemy buffers + Python overhead). Two replicas
    # × 6Gi = 12 Gi of the 22 Gi node, leaving room for api/pg/redis.
    # Do NOT raise memory to "buy" more concurrency — a bigger limit just
    # lets one pod consume more of the shared node and re-opens the
    # 2026-05-31 OOM-cascade path. Add a node/replica for throughput instead.
    limits:
      cpu: 6000m
      memory: 6Gi
    requests:
      cpu: 1000m
      memory: 4Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
  env:
    # Retention of the API-key usage log (tasks.cleanup_api_key_usage_events).
    - name: API_USAGE_RETENTION_DAYS
      value: "400"
    - name: ENVIRONMENT
      value: "production"  # IMPORTANT: Must be 'production' for proper authentication
    - name: FRONTEND_URL
      value: "https://{{ .Values.global.domain }}"
    - name: DATABASE_URI
      valueFrom:
        secretKeyRef:
          name: benger-postgres-credentials
          key: uri
    - name: REDIS_URI
      valueFrom:
        secretKeyRef:
          name: benger-redis-credentials
          key: uri
    - name: SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: benger-api-secrets
          key: secret_key
    - name: JWT_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: benger-api-secrets
          key: secret_key
    # See api env block above for context on why ENCRYPTION_KEY is pinned.
    - name: ENCRYPTION_KEY
      valueFrom:
        secretKeyRef:
          name: benger-api-secrets
          key: encryption_key
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: benger-llm-credentials
          key: openai_api_key
    - name: ANTHROPIC_API_KEY
      valueFrom:
        secretKeyRef:
          name: benger-llm-credentials
          key: anthropic_api_key
    # SendGrid configuration for workers
    - name: SENDGRID_API_KEY
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: SENDGRID_API_KEY
          optional: true
    - name: EMAIL_FROM_ADDRESS
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: EMAIL_FROM_ADDRESS
          optional: true
    - name: EMAIL_FROM_NAME
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: EMAIL_FROM_NAME
          optional: true
    # Mail provider switch (services/shared/mailer/mail_client.py): "sendgrid"
    # (default) or "cloudflare". With cloudflare, mail from
    # CLOUDFLARE_EMAIL_DOMAINS (default: the EMAIL_FROM_ADDRESS domain) goes
    # through Cloudflare Email Sending, other brands stay on SendGrid.
    - name: EMAIL_PROVIDER
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: EMAIL_PROVIDER
          optional: true
    - name: CLOUDFLARE_EMAIL_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: CLOUDFLARE_EMAIL_API_TOKEN
          optional: true
    - name: CLOUDFLARE_ACCOUNT_ID
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: CLOUDFLARE_ACCOUNT_ID
          optional: true
    - name: CLOUDFLARE_EMAIL_DOMAINS
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: CLOUDFLARE_EMAIL_DOMAINS
          optional: true
    # Postmark: fallback for account-critical mail when Cloudflare rejects
    # (mailer/postmark_client.py). Unset token = no Postmark; the monthly
    # limit (default 100) matches the plan. Prod only: staging keeps no token
    # so it cannot spend the shared monthly budget.
    - name: POSTMARK_SERVER_TOKEN
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: POSTMARK_SERVER_TOKEN
          optional: true
    - name: POSTMARK_MONTHLY_LIMIT
      valueFrom:
        secretKeyRef:
          name: benger-email-config
          key: POSTMARK_MONTHLY_LIMIT
          optional: true
    - name: EMAIL_ENABLED
      value: "true"
    - name: MAIL_ENABLED
      value: "true"
    # Vertretbar billing (extended): the worker applies the grading dispatch
    # policy (tier judge model + vertretbar-org key routing) and settles the
    # metered ledger at task end, so it needs the same billing env as the api.
    # Secrets are optional — an absent secret leaves billing a no-op. The beat
    # deployment inherits this env block.
    - name: BILLING_PROVIDER
      value: "stripe"
    - name: VERTRETBAR_ORG_ID
      value: "06620390-5817-4bc8-b94f-efa0798d5026"  # prod Vertretbar org
    # Link host of Vertretbar-branded notification emails (the worker has no request host).
    - name: VERTRETBAR_FRONTEND_URL
      value: "https://vertretbar.net"
    - name: VERTRETBAR_FREE_GRADINGS_PER_WEEK
      value: "1"
    - name: VERTRETBAR_PER_GRADING_PRICE_CENTS
      value: "100"
    - name: VERTRETBAR_FLASHCARD_BILLABLE
      value: "false"
    - name: STRIPE_METER_EVENT_NAME
      value: "exam_grading"
    - name: STRIPE_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: benger-billing-secrets
          key: stripe_secret_key
          optional: true
    - name: STRIPE_PRICE_BASE
      valueFrom:
        secretKeyRef:
          name: benger-billing-secrets
          key: stripe_price_base
          optional: true
    - name: STRIPE_PRICE_METERED
      valueFrom:
        secretKeyRef:
          name: benger-billing-secrets
          key: stripe_price_metered
          optional: true

# Additional Celery worker pools (deployment-worker-pools.yaml).
#
# Why pools instead of Celery message priority: Celery never preempts a running
# task, and prefetch reserves messages before priority is consulted. With the
# single 4-slot pool we had, a priority-9 immediate evaluation still waited for a
# minutes-long LLM call to return. Isolating execution SLOTS is the only thing
# that makes user-blocking work actually immediate. See the module docstring in
# services/shared/celery_queues.py.
#
# A MAP, not a list: Helm merges maps key-by-key but REPLACES lists wholesale
# (which is why values-staging.yaml has to restate all of workers.env). With a
# map, staging overrides just replicaCount/resources and inherits the rest.
#
# Pools INHERIT workers.{image,env,extraEnv} on purpose:
#   * CI pins images with `--set workers.image.*` only (extended/cicd.yml), so
#     inheriting means no workflow change.
#   * values-extended.yaml sets workers.extraEnv (BENGER_REQUIRE_EXTENDED, LTI
#     signing key) — inheriting means the extended overlay needs no edit at all.
# Same trick deployment-beat.yaml already uses.
workerPools:
  # User-blocking work: immediate evaluation (KI-Votum), report refresh on
  # annotation write, timer auto-submit, flashcard grading, LTI grade push.
  #
  # Sizing rationale — this pool provably runs NO local ML, so the 2026-05-31
  # OOM-cascade constraints on the bulk pool do not apply here:
  #   * `import tasks` pulls no torch/spacy (tests/test_tasks_import_lightness.py)
  #   * every interactive task filters out HEAVY_METRICS via
  #     shared/metric_filters.is_immediate_eligible
  # so a fork is SQLAlchemy + httpx (~250-400 MB), not the 1.5-2 GB of an
  # embedding fork. --max-memory-per-child recycles a leaking fork long before it
  # could walk toward the node-OOM path.
  #
  # maxTasksPerChild is 200, not the bulk pool's 20: recycling costs a ~1.7s
  # re-import, and that latency is exactly what this pool exists to avoid. There
  # is no embedding leak here to reclaim aggressively.
  fast:
    enabled: true
    # (The drain-only `celery` queue — Celery's old default name — was removed
    # 2026-07-30 once its Redis list hit 0 in both namespaces; issue #286.)
    queues: [interactive]
    replicaCount: 2
    concurrency: 2
    # 1 so a burst spreads across both replicas instead of one pod reserving it.
    prefetchMultiplier: 1
    maxTasksPerChild: 200
    # ~390 MB. The old 800000 could never fire: two forks at 780 MB plus the
    # ~200 MB main process are far past the 1536Mi limit, so the kernel would
    # OOM-kill the pod first. Forks sit at ~180-225 MB after hours of grading
    # (2026-09-17), so this only recycles a fork that really grew. See the
    # memory budget note on `aux` below.
    maxMemoryPerChildKb: 400000
    resources:
      limits:
        cpu: 1000m
        memory: 1536Mi
      requests:
        cpu: 100m
        memory: 512Mi

  # Rate-limited mail only.
  #
  # Separate from `fast` because a rate-limited task takes the limit_task branch
  # in celery/worker/strategy.py WITHOUT a qos.increment_eventually() — it holds
  # its prefetch slot while waiting for a token. A 200-address bulk invite at
  # 30/m would otherwise pin the interactive pool for ~7 minutes.
  #
  # ONE replica on purpose: the rate-limit token bucket lives on the worker
  # instance and is shared by its forks, so replicas multiply the rate, so
  # the old 2-replica shared pool made the effective invitation rate 60/m —
  # double the configured 30/m. If 30/m is too slow for a course launch, raise
  # the rate_limit in celery_queues.task_annotations() deliberately rather than
  # adding replicas here.
  #
  # prefetchMultiplier stays at Celery's default 4: rate-limited tasks WANT
  # headroom to sit in.
  #
  # Memory budget. Forks keep their peak RSS after a task, and
  # --max-memory-per-child compares that peak (ru_maxrss) after each task. The
  # pod must fit: main process (~200 MB) + every fork at the recycle threshold
  # + the growth of a running task + two overlapping probe imports (~180 MB
  # each, `celery inspect ping` re-imports tasks.py). Keep the threshold well
  # below (limit - main - probes) / concurrency.
  aux:
    enabled: true
    queues: [emails]
    replicaCount: 1
    concurrency: 2
    prefetchMultiplier: 4
    maxTasksPerChild: 200
    maxMemoryPerChildKb: 350000  # ~340 MB; 200 + 2*(340+50) + 360 = ~1340 MB
    resources:
      limits:
        cpu: 500m
        memory: 1536Mi
      requests:
        cpu: 50m
        memory: 256Mi

  # Periodic housekeeping (recompute_aggregates, the immediate-eval sweep, the
  # LTI and billing sweeps). Its own pool since 2026-09-17: the hourly
  # recompute_aggregates run OOM-killed the shared emails+maintenance pod
  # (1Gi, recycle threshold 800 MB that the pod could never reach), which also
  # took invitation mail down with it. A maintenance OOM can no longer stop
  # mail. Concurrency 1 keeps the budget small; the beat tasks are short apart
  # from recompute_aggregates (~5 min), and nothing here has a user waiting.
  # Budget: 200 + (400 + 150) + 360 = ~1110 MB against 1536Mi.
  maintenance:
    enabled: true
    queues: [maintenance]
    replicaCount: 1
    concurrency: 1
    prefetchMultiplier: 1
    maxTasksPerChild: 50
    maxMemoryPerChildKb: 400000  # ~390 MB
    resources:
      limits:
        cpu: 1000m
        memory: 1536Mi
      requests:
        cpu: 50m
        memory: 256Mi

# Celery beat scheduler (deployment-beat.yaml). Single-replica process that
# fires the periodic schedule in tasks.py (app.conf.beat_schedule), e.g.
# recompute-aggregates. Reuses the workers image + env. Keep replicas at 1
# (enforced in the template) — a second beat double-dispatches every
# scheduled task. Lightweight: it only dispatches tasks to the broker; the
# actual work runs on the workers.
beat:
  enabled: true
  name: beat
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 384Mi

frontend:
  name: frontend
  replicaCount: 1
  deploymentStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  image:
    repository: ghcr.io/sebastiannagl/benger/frontend
    pullPolicy: IfNotPresent
    tag: latest
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.priority: "100"
      # cert-manager annotation removed: using explicit Certificate resource
      # in templates/certificates.yaml for wildcard support
    # Apex only. The "*.<domain>" host that served org subdomains is gone: no
    # frontend feature uses them anymore, and the catch-all answered any
    # unclaimed subdomain with the app.
    hosts:
      - host: what-a-benger.net
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: benger-tls
        hosts:
          - what-a-benger.net
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 80
  env:
    - name: NEXT_PUBLIC_API_URL
      value: "https://api.{{ .Values.global.domain }}"
    - name: INTERNAL_API_URL
      value: "http://benger-api:8000"

# Native annotation system only - Label Studio completely removed

postgresql:
  enabled: true
  image:
    # PINNED (2026-06-10): Postgres 18.3 + Photon OS + FIPS-OpenSSL is the
    # official baseline. History: Broadcom rewrote the
    # bitnami/postgresql:15.3.0-debian-11-r17 tag post-acquisition to ship
    # this PG-18 content, the cluster's data dir is in PG 18 format ever
    # since, and the tag has now been DELETED from Docker Hub entirely —
    # prod survived only on the node's containerd cache. The running image
    # (manifest list sha256:d0fd908d…) was copied byte-identical to the
    # project's own GHCR so it can never be purged or rewritten upstream.
    # bitnamilegacy/postgresql:15.3.0-… archives the ORIGINAL Debian-11 /
    # PG 15.3 build — do NOT switch to it, PG 15 binaries cannot open the
    # PG 18 data dir. App-side FIPS mitigations (func.hashtext, pg_dump
    # 18-alpine) stay. See workspace CLAUDE.md → "Postgres image content
    # drift". The earlier pin attempt (PR #16, sha256:e6d86d16…) failed
    # because that value is the image CONFIG digest (crictl `id`), not the
    # pullable manifest-list digest.
    registry: ghcr.io
    repository: sebastiannagl/benger-extended/postgresql
    tag: "pg18.3-photon-fips"
    digest: "sha256:d0fd908dfe8697467f930c1894fcdbbbbd093e3dcf104204a00121ffef017749"
    pullPolicy: IfNotPresent
  auth:
    username: postgres
    # password: # Generated automatically or set via external secrets
    database: benger
  primary:
    extendedConfiguration: |
      max_connections = 200
    persistence:
      enabled: true
      size: 5Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi

redis:
  enabled: true
  image:
    # PINNED (2026-09-08): bitnami/redis:7.0.12-debian-11-r0 has been DELETED
    # from Docker Hub (Broadcom's Bitnami purge, same as the postgresql tag);
    # prod ran it from the node's containerd cache only. The manifest list
    # the pod was running (sha256:23289a4f…) was copied byte-identical into
    # the project's GHCR via the extended repo's rescue-image workflow. Same
    # pull secret as the app images (global.imagePullSecrets). Redis 7.0 is
    # old; moving to a current Redis means a different chart, tracked as a
    # follow-up — this pin only removes the pull-failure time bomb.
    registry: ghcr.io
    repository: sebastiannagl/benger-extended/redis
    tag: "7.0.12-debian-11-r0"
    digest: "sha256:23289a4f4765da46419590fb80d8803363b07e5783ef45396ff85c641db81a0e"
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    # password: # Generated automatically or set via external secrets
  replica:
    replicaCount: 0
  master:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

# Database migrations configuration
# Migrations run as a Helm pre-upgrade/pre-install hook before deployments
migrations:
  # Enable automatic migrations (disable for manual control)
  enabled: true
  # Number of retry attempts on failure
  backoffLimit: 3
  # Timeout in seconds for migration job
  timeoutSeconds: 300
  # Time to keep completed job before cleanup
  ttlSecondsAfterFinished: 300
  # Resource limits for migration job
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Database backup configuration
# Backups run as a K8s CronJob using pg_dump.
# Disabled in prod: disaster recovery is hosting-provider server snapshots
# of the whole machine, taken every few hours (confirmed 2026-06-10). No
# host-level cron/systemd backup job exists on the server — the last
# in-cluster pg_dump under /opt/benger-backups is from 2026-05-01, when this
# CronJob was switched off. Re-enable here only if you additionally want an
# in-cluster logical dump (e.g. for point-in-time restores finer than the
# snapshot cadence, or to migrate data off the box).
backup:
  enabled: false
  # Cron schedule (default: daily at 02:00 UTC)
  schedule: "0 2 * * *"
  # pg_dump version must be >= the running server's major version, otherwise
  # backups silently produce a 0-table dump (we caught this on 2026-04-28 after
  # the server move bumped the runtime binary to PG 18 while the chart still
  # shipped postgres:15-alpine). Keep this in sync with the bitnami postgresql
  # image's actual binary version, not the image tag.
  image: "postgres:18-alpine"
  # Host path on the node to store backups
  hostPath: "/opt/benger-backups"
  # Retention policy
  retention:
    daily: 7
    weekly: 4
    monthly: 6
  backoffLimit: 1
  timeoutSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # The backup pod stays root: the hostPath (/opt/benger-backups) and the dumps
  # already on it are root-owned, the kubelet never applies fsGroup to a
  # hostPath, and `apk add age` writes to root-owned image paths. The baseline
  # container settings (no privilege escalation, ALL capabilities dropped,
  # RuntimeDefault seccomp) still apply; root needs no capability for files it
  # owns. Verified locally: `apk add --no-cache age` succeeds in
  # postgres:18-alpine with --cap-drop ALL and no-new-privileges.
  securityContext:
    pod:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
  # Encrypt every dump with age before it touches the disk. Off by default so
  # the chart deploys without the Secret; once enabled, a missing Secret fails
  # the job with an explicit error and writes no backup. Create the key pair
  # OFF the node, keep the private key offline (password manager / two
  # operators), and put only the public key into the namespace:
  #   age-keygen -o benger-backup-key.txt      # prints "Public key: age1..."
  #   kubectl -n <ns> create secret generic benger-backup-encryption \
  #     --from-literal=recipient=age1...
  # Several recipients (e.g. an escrow key): one per line in `recipient`
  #   kubectl -n <ns> create secret generic benger-backup-encryption \
  #     --from-file=recipient=./recipients.txt
  # Restore steps are in templates/cronjob-backup.yaml.
  encryption:
    enabled: false
    secretName: benger-backup-encryption
    secretKey: recipient
  # Upload each new (encrypted) dump to an S3 bucket that is NOT on this node.
  # Requires encryption.enabled (the chart refuses to render otherwise). Keys
  # land under <prefix>/{daily,weekly,monthly}/; prefix defaults to the
  # namespace. Retention on the remote side is the bucket's lifecycle rules,
  # set them there (e.g. daily/ 30 days). Use credentials that can only
  # PutObject/GetObject on that bucket (no delete), so a compromised node
  # cannot wipe the offsite copies. A missing Secret or key fails the job
  # after the local backup was written.
  #   kubectl -n <ns> create secret generic benger-backup-offsite \
  #     --from-literal=endpoint=https://<s3-host> \
  #     --from-literal=bucket=<bucket> \
  #     --from-literal=access-key=<key-id> \
  #     --from-literal=secret-key=<secret> \
  #     --from-literal=prefix=<optional, default the namespace>
  # image: empty = the pinned mc image from minio.mcImage.
  offsite:
    enabled: false
    secretName: benger-backup-offsite
    image: ""

# MinIO object storage for async exports/imports (issue #158).
#
# REQUIRED — object storage is a hard dependency for BOTH editions. Import and
# export run exclusively through object storage: there is no synchronous
# fallback and the storage singleton no longer silently downgrades to a local
# /tmp backend (a misconfigured S3 endpoint now crashes the pod at startup
# instead of writing exports to disk). The api+workers receive S3_* env from the
# "benger.storageEnv" helper whenever enabled=true, which is the default.
#
# DEPLOYMENT PRE-REQUISITE: the credentials Secret MUST exist in the target
# namespace before deploy, or the api/workers pods CrashLoop on the missing
# secretKeyRef. Create it once per namespace:
#     kubectl create secret generic benger-minio-credentials -n <ns> \
#       --from-literal=access-key=<user> --from-literal=secret-key=<pass>
#   (the same pair is used as the MinIO root user AND the app's S3 creds).
# The image digests below are multi-arch indexes incl. linux/amd64.
#
# enabled=false is intended only for a local test/dev double (STORAGE_TYPE=local
# reached via tests / bare runs), never for a deployed namespace.
minio:
  enabled: true
  image:
    # pgsty/minio: maintained community build of MinIO. Upstream stopped
    # publishing images on 2026-09-24 (quay.io and Docker Hub both 401).
    # RELEASE.2026-08-04T00-00-00Z, pinned by digest (Bitnami/Broadcom drift
    # lesson). Verified data-compatible with RELEASE.2025-09-07 both ways.
    repository: docker.io/pgsty/minio
    digest: "sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372"
    pullPolicy: IfNotPresent
  mcImage:
    # pgsty/mc RELEASE.2026-09-16T00-00-00Z (maintained build of mc)
    repository: docker.io/pgsty/mc
    digest: "sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd"
    pullPolicy: IfNotPresent
  storageType: minio
  # Internal cluster endpoint api+workers connect to for the upload itself.
  # Empty → http://<release>-minio:9000.
  internalEndpoint: ""
  bucket: benger-exports
  region: us-east-1
  # Public host that serves browser-bound presigned download URLs. REQUIRED when
  # enabled — SigV4 binds the host, so this is the host the URL is signed for.
  # Covered by the existing wildcard cert (*.what-a-benger.net).
  publicHost: storage.what-a-benger.net
  credentialsSecret: benger-minio-credentials
  accessKeySecretKey: access-key
  secretKeySecretKey: secret-key
  # Object lifecycle. The PVC shares the node's single physical disk with
  # Postgres/WAL/backups, so disk pressure is the real risk: expire finished
  # export artifacts to cap growth.
  expiryDays: 7
  # NOTE: not currently applied. The pinned MinIO release (RELEASE.2025-09-07)
  # rejects an AbortIncompleteMultipartUpload lifecycle action on
  # PutBucketLifecycle (InvalidArgument, verified via both mc and boto3), so the
  # minio-init job ships expiry-only. The export worker aborts its own multipart
  # upload on failure (Phase 2d), leaving only hard-kill orphans — a bounded
  # edge case. Kept here so the rule can be re-enabled if MinIO restores support.
  abortIncompleteMultipartDays: 1
  persistence:
    size: 20Gi
    storageClass: ""  # "" = cluster default StorageClass (local-path on K3s)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.priority: "200"
  # MinIO server securityContext: OFF by default. The pinned pgsty/minio image
  # runs as root (no USER in the image) and the existing PVC data is therefore
  # root-owned. fsGroup cannot fix that here: the K3s local-path volumes are
  # hostPath-backed, and the kubelet only applies fsGroup to volume types it
  # can chown. To move MinIO to uid 1000: scale it to 0, run
  #   chown -R 1000:1000 /var/lib/rancher/k3s/storage/<pvc-dir>
  # on the node, then set enabled: true here (the baseline pod/container
  # settings then apply) and watch the first start.
  securityContext:
    enabled: false
  # The minio-init Job (mc client, writes only /tmp) inherits the baseline.
  initSecurityContext: {}

# Traefik middleware configuration
# Creates Middleware CRDs for security headers, compression, etc.
middleware:
  enabled: true
  securityHeaders:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: false

# Vertretbar student product — serves the (already host-wired) student view on a
# second branded apex from THIS same release, no separate backend. A neutral
# open-core hook: the frontend already recognizes vertretbar.net
# (STUDENT_LOCKED_DOMAINS in services/frontend/src/lib/utils/subdomain.ts) and the
# auth cookies are host-only (the Next proxy strips any Domain), so they work on
# any host as is. Serving the host needs no app code, only this ingress + its own
# TLS cert.
#
# Rendered when `enabled` (default off, so the open-core base and any deploy that
# doesn't opt in stay inert). Host + cert are per-environment via the overlays:
# this base is the prod default (vertretbar.net); values-staging.yaml overrides to
# staging.vertretbar.net. Turn it on in the environment overlay you want it in
# (values-staging.yaml for the staging beta; this file / values-extended.yaml for
# the prod go-live).
vertretbar:
  enabled: true  # prod go-live (staging keeps its own host via values-staging.yaml)
  host: vertretbar.net
  # Own cert: the *.what-a-benger.net wildcard does not cover a different apex.
  # Issued via HTTP-01 (letsencrypt-prod-http01), NOT the Cloudflare DNS-01 issuer
  # used for the wildcard — vertretbar.net lives on external DNS (Namecheap) with
  # no Cloudflare zone, so DNS-01 can't create its TXT record. HTTP-01 just needs
  # the A record + Traefik. cert issues once the A record resolves.
  tlsSecretName: vertretbar-tls
  certIssuer: letsencrypt-prod-http01
  # Closed-beta gate: a Traefik BasicAuth middleware locks the WHOLE host behind one
  # shared password until public launch — flip enabled:false to remove it in one
  # step. Compatible with the app's cookie-only auth (the browser sends
  # Authorization: Basic; the backend authenticates via the session cookie). The
  # htpasswd Secret must be pre-created in the namespace (key: users), like the
  # other pre-created secrets:
  #   htpasswd -nbB beta '<password>' | kubectl -n benger create secret generic \
  #     benger-beta-auth --from-file=users=/dev/stdin
  betaAuth:
    enabled: false  # beta gate dropped 2026-07-27 (open beta); flip true to re-lock (needs benger-beta-auth secret)
    secretName: benger-beta-auth

# Pod and container securityContext baseline (audit 2026-10-31, S5) for every
# workload this chart templates: api, frontend, the bulk worker pool, every
# workerPools entry, beat, the migrations Job, the minio-init Job, the backup
# and demo-reset CronJobs (the last two and MinIO override it, see their
# blocks). The bitnami postgresql and redis subcharts keep their own settings.
#
# A component overrides with `<component>.securityContext` of the same shape
# (api, frontend, workers, beat, migrations, backup, workerPools.<pool>,
# minio, minio.initSecurityContext, demoReset). Keys replace the baseline key
# by key, so `runAsUser: 0` or `runAsNonRoot: false` work as written.
#
# Emergency switch (one line, all workloads):
#   helm upgrade ... --set securityContext.enabled=false
# or for one workload: --set api.securityContext.enabled=false
#
# uid/gid 1000 is the user the api, workers and frontend images run as and
# own their app directories with. Images built before that change ran as root
# (api, workers) and 1001 (frontend); do not deploy this baseline with them
# (or set securityContext.enabled=false for that deploy). fsGroup 1000 makes
# emptyDir and Secret volumes group-accessible for that user.
#
# readOnlyRootFilesystem stays false: the api writes PROMETHEUS_MULTIPROC_DIR
# and upload spool files under /tmp, the workers spool exports and imports in
# /tmp, beat keeps its schedule DB in /tmp and Next.js writes .next/cache. None
# of those paths is a mounted volume yet; turning it on needs an emptyDir for
# each first.
securityContext:
  enabled: true
  pod:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: false

# Ingress NetworkPolicies for the release namespace (templates/networkpolicy.yaml,
# audit 2026-10-31 S5). Default-deny ingress for every pod, then: everything
# within the namespace, Traefik to the routed backends only, Prometheus to the
# scrape targets only. No egress rules. Set enabled: false to remove all of
# them in one upgrade.
#
# First rollout: watch for 30 minutes. Grafana targets (benger-api and
# celery-exporter up in every namespace), the next backup run, an LTI launch
# from the ilias-test / moodle-test appliances, a vertretbar.net page load,
# a presigned MinIO download, and any cert-manager HTTP-01 renewal.
networkPolicy:
  enabled: true
  # Namespace Traefik runs in (K3s bundles it in kube-system).
  ingressNamespace: kube-system
  # Optional pod selector inside ingressNamespace. Empty = any pod there.
  # Tighten to Traefik only with {app.kubernetes.io/name: traefik}
  # (the label the monitoring chart's own Grafana policy relies on).
  ingressPodSelector: {}
  # Namespace of kube-prometheus-stack + benger-monitoring
  # (benger-extended/infra/monitoring).
  monitoringNamespace: monitoring
  # Optional pod selector inside monitoringNamespace. Empty = any pod there.
  # Tighten with {app.kubernetes.io/name: prometheus}.
  monitoringPodSelector: {}
  # Backends Traefik may reach. podLabels values pass through tpl. Ports are
  # container ports. Entries for pods that do not exist in a namespace are
  # harmless (they select nothing).
  ingressTargets:
    - name: frontend
      reason: "Traefik routes the main host, the vertretbar apex and the LTI registration pages to the frontend (container port 3000)."
      podLabels:
        app: "{{ .Release.Name }}-{{ .Values.frontend.name }}"
      ports: [3000]
    - name: api
      reason: "Traefik routes the api host (incl. LTI launch, AGS and JWKS endpoints) to the api (container port 8000)."
      podLabels:
        app: "{{ .Release.Name }}-{{ .Values.api.name }}"
      ports: [8000]
    - name: minio
      reason: "Traefik routes the public storage host (presigned up/downloads) to the MinIO S3 port (9000). The console port 9001 has no Ingress and stays closed."
      podLabels:
        app: "{{ .Release.Name }}-minio"
      ports: [9000]
    - name: acme-solver
      reason: "cert-manager HTTP-01 solver pods (vertretbar.net cert via letsencrypt-prod-http01) are created in this namespace and must answer Let's Encrypt through Traefik (port 8089)."
      podLabels:
        acme.cert-manager.io/http01-solver: "true"
      ports: [8089]
    - name: ilias-test
      reason: "Test ILIAS appliance in ns benger (benger-extended/infra/lti-dev/k8s-ilias-test.yaml), served at ilias.what-a-benger.net on port 80."
      podLabels:
        app: ilias-test
      ports: [80]
    - name: moodle-test
      reason: "Test Moodle appliance in ns benger (benger-extended/infra/lti-dev/k8s-moodle-test.yaml), served at moodle.what-a-benger.net on port 8080."
      podLabels:
        app: moodle-test
      ports: [8080]
  # What the monitoring namespace scrapes (benger-monitoring PodMonitors). There
  # is no postgres or redis exporter: postgresql.metrics and redis.metrics are
  # off, and celery-exporter runs IN this namespace, so its Redis access is
  # covered by the same-namespace rule.
  monitoringTargets:
    - name: api-metrics
      reason: "Prometheus scrapes /internal/metrics on the api http port (PodMonitor benger-api, container port 8000)."
      podLabels:
        app: "{{ .Release.Name }}-{{ .Values.api.name }}"
      ports: [8000]
    - name: celery-exporter
      reason: "Prometheus scrapes the per-namespace celery-exporter (PodMonitor celery-exporter, container port 9808)."
      podLabels:
        app.kubernetes.io/name: celery-exporter
      ports: [9808]
  # Escape hatch: namespaces given full ingress to every pod here.
  extraAllowedNamespaces: []
