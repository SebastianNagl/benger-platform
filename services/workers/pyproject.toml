[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benger-workers"
version = "0.1.0"
description = "BenGER evaluation workers (Celery + ML metrics)"
# 3.13. Previously capped at 3.12 because numpy<2.0 and spaCy<3.8 have no
# cp313 wheels; lifting both (numpy 2.x + spaCy 3.8 / thinc 8.3.x, see below)
# removed that ceiling.
requires-python = ">=3.13"
# Single dependency source for the workers images (base + app safety net).
# The images install the locked set from uv.lock (`uv sync --locked`), never a
# fresh resolve: after editing this list run `uv lock` here and commit the
# lock; CI fails on a stale lock (`uv lock --check`). Test-only packages live
# in the `test` extra below: only the `test` stage of services/workers/
# Dockerfile (the compose test runner) installs it, so production images carry
# no pytest. The runners still add requirements-test.txt at runtime on top.
dependencies = [
    # ── SHARED RUNTIME DEPS (also declared by services/api) ──────────────────
    # Their bounds live in services/shared/dependency-constraints.txt, copied
    # into [tool.uv] constraint-dependencies below and into the api pyproject
    # by scripts/sync_shared_constraints.py. CI (`--check`) fails when the two
    # uv.lock files resolve any common package to different versions.
    "celery==5.6.3",
    "redis>=6.4.0,<6.5.0",  # kombu 5.6 caps redis at <6.5
    "cryptography>=46.0.0,<51.0.0",  # bounds aligned with api
    "PyJWT[crypto]>=2.8.0,<2.16.0",  # bounds aligned with api; LTI 1.3 AGS token client (extended workers)
    "psycopg2-binary>=2.9.13",
    # SQLAlchemy 2.1 resolves postgresql:// to psycopg 3, which the workers do
    # not ship (psycopg2 only): every worker crashed at import on 2026-09-30
    # after the weekly base rebuild pulled 2.1.1. Move with the api pin.
    "sqlalchemy>=2.0.54,<2.1",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    # transformers 5 / sentence-transformers 6 are BLOCKED by optimum: the
    # ONNX backend (optimum[onnxruntime] -> optimum-onnx 0.1.0) pins
    # transformers<4.58. Re-check when optimum-onnx supports transformers 5.
    "transformers>=4.57.6,<4.58",
    "sentencepiece>=0.2.1",  # Required by T5Tokenizer for QAGS
    "tiktoken>=0.13.0",  # Required by AlbertTokenizer for SummaC/ViTC
    "torch>=2.12.0,<2.15.0",
    # numpy 2.x. The former `<2.0` cap existed because thinc 8.2.x wheels were
    # compiled against the numpy-1.x ABI (88-byte PyArray_Descr) and mixing
    # raised ImportError "numpy.dtype size changed" at spacy.load(). That is
    # resolved by moving spaCy to 3.8 / thinc 8.3.x below, which ship numpy-2.x
    # wheels — the two must move together. The build-time spacy.load() + NER
    # assertion in Dockerfile.base is the guard: it fails the image build if the
    # ABI ever mismatches again.
    "numpy>=2.1.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "nltk>=3.9.4",
    # German NER for the coherence metric. 3.8 line pulls thinc 8.3.x, which is
    # what makes numpy 2.x (and Python 3.13) possible — see the numpy note above.
    "spacy>=3.8.0,<3.9",
    # Pin to a specific spaCy model release so worker images are reproducible.
    # de_core_news_md is the medium-size German news pipeline; see
    # Dockerfile.base download step for the actual install. Model minor version
    # tracks the spaCy minor: a 3.7 model will not load under spaCy 3.8.
    "de-core-news-md @ https://github.com/explosion/spacy-models/releases/download/de_core_news_md-3.8.0/de_core_news_md-3.8.0-py3-none-any.whl",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4.0",
    "jsonschema==4.26.0",
    "ijson>=3.5.0",  # Streaming JSON parser for memory-bounded import worker (issue #158)
    # boto3/botocore: the export/import worker streams artifacts to S3-compatible
    # object storage (multipart upload / download); without them the relocated
    # storage singleton falls back to local filesystem (issue #158).
    "boto3>=1.35.0",
    "botocore>=1.43.11",
    # AI service dependencies
    "openai==3.31.0",
    "anthropic==1.15.0",
    "google-genai>=1.75.0",
    "mistralai>=1.12.4",  # Mistral AI models
    "cohere>=5.21.1",  # Cohere models
    "aiohttp==3.14.5",
    # Neural metrics (GPU on-demand)
    "bert-score>=0.3.13",
    "sentence-transformers>=5.7.0,<6",  # v6 needs transformers 5 (blocked, see above)
    "moverscore>=1.0.3",
    # pyemd - removed: metadata version mismatch with uv, POT is preferred on all platforms
    # summac removed - conflicts with transformers>=4.57.6 (requires huggingface-hub<=0.17.0)
    # Factuality checks use SummaC or manual NLI approaches
    # ARM64-compatible alternatives
    "onnxruntime>=1.25.1",  # Native ARM64 support
    "optimum[onnxruntime]>=1.21.0",  # HuggingFace ONNX export/inference
    "POT>=0.9.6.post1",  # Earth Mover Distance (works on ARM64, replaces pyemd)
    # Statistics
    "statsmodels>=0.14.0",
    # Anki flashcard import (issue #35): decompresses the newest .apkg form
    # (collection.anki21b = zstd-compressed SQLite). Used by services/shared/anki,
    # imported by both api and workers. arm64 wheels published — normal pin is fine.
    # Keep aligned with the api (services/api/pyproject.toml).
    "zstandard>=0.22,<1.0",
    "stripe>=15.0.0,<17.0.0",  # Vertretbar billing meter reporting (extended-only)
]

[project.optional-dependencies]
# Test runner only (Dockerfile `test` stage). Never installed in production.
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.4.0",  # Prevent tests from hanging indefinitely
    "psutil>=6.1.0",
    "fakeredis>=2.36.1",
    "memory-profiler>=0.61.0",
    "pytest-xdist>=3.8.0",  # pytest.ini runs the suite with -n auto
]

[tool.hatch.build.targets.wheel]
# Dep-manifest only — the images copy code directly; nothing is packaged.
bypass-selection = true

[tool.uv]
# Dependency manifest only: uv locks and installs the dependencies, never the
# project itself.
package = false
# BEGIN shared constraints (generated by scripts/sync_shared_constraints.py, do not edit)
constraint-dependencies = [
    "sqlalchemy==2.0.54",
    "psycopg2-binary==2.9.13",
    "asyncpg==0.32.0",
    "pydantic==2.14.1",
    "jsonschema==4.26.0",
    "celery==5.6.3",
    "kombu>=5.6,<5.7",
    "redis==6.4.0",
    "boto3>=1.35.0,<2",
    "botocore>=1.43.11,<2",
    "httpx==0.28.1",
    "aiohttp==3.14.5",
    "requests>=2.32,<3",
    "PyJWT==2.15.1",
    "cryptography>=46.0.0,<51.0.0",
    "python-jose==3.5.0",
    "jinja2==3.1.6",
    "pyyaml>=6.0,<7",
    "python-dotenv==1.2.4",
    "numpy>=2.1.0,<3",
    "scipy>=1.17.1,<2",
    "openai==3.31.0",
    "anthropic==1.15.0",
    "google-genai>=1.75.0,<3",
    "tiktoken>=0.13.0,<1",
    "ijson>=3.5.0,<4",
    "zstandard>=0.22,<1.0",
    "stripe>=15.0.0,<17.0.0",
]
# END shared constraints

# ── CPU-only PyTorch ─────────────────────────────────────────────────────────
# This deployment has no GPU: the node reports no nvidia.com/gpu capacity and
# the Helm chart requests no accelerator. The default PyPI torch wheel drags in
# ~2.7 GB of nvidia-* CUDA libraries plus ~690 MB of triton that can never
# execute here, and torch itself is 1.1 GB instead of 718 MB. The only CUDA
# code path (ml_evaluation/sample_evaluator.py) is an
# `if torch.cuda.is_available()` guard that is already always false, so this
# changes image size, not behaviour.
#
# Declared here rather than as an --index-url in the Dockerfiles because every
# install path reads this file: Dockerfile.base, the app Dockerfile's
# base-staleness safety net, and local dev. A flag in one Dockerfile would let
# the other silently reinstall the CUDA build on top and undo the saving.
#
# `explicit = true` scopes the index to packages that name it below — every
# other dependency still resolves from PyPI.
#
# TO RE-ENABLE GPU: delete both blocks below. The `torch` bound in
# [project.dependencies] is untouched and index-agnostic, so the next install
# picks the default CUDA wheel again.
#
# NOTE: this is uv-specific config. uv.lock records the CPU wheels (with their
# download.pytorch.org URLs and hashes) and the images install from the lock,
# so there is no path that bypasses it, but a future switch to plain pip
# would silently restore the CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
