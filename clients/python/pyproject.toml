[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "benger-client"
dynamic = ["version"]
description = "Python client for the BenGER API (access keys, /api/v1 and the full API)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "BenGER contributors" }]
keywords = ["benger", "llm", "benchmark", "legal", "evaluation", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[project.urls]
Homepage = "https://what-a-benger.net"
Source = "https://github.com/SebastianNagl/benger-platform"

[tool.hatch.version]
path = "src/benger_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/benger_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Same ruff version CI pins for publications/ (ci.yml "Lint publications").
required-version = "==0.16.9"
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
