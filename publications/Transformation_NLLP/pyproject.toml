[project]
name = "benger-transformation"
version = "0.1.0"
description = "BenGER Transformation: exam-specific 100-point rubrics for LLM-as-judge legal grading"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "pyyaml>=6.0",
    "nbformat>=5.0",
    "nbclient>=0.8",
    "numpy>=2.0",
    # Upper-bound scipy: scipy 1.17 changed wilcoxon's default `method`,
    # which silently shifts small-n p-values (see Benchmark_EMNLP pin rationale).
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pingouin>=0.5.5",
    # Rubric artifact validation (criteria shape, sum==100)
    "jsonschema>=4.23",
]
