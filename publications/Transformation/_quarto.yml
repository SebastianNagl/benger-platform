project:
  type: default

# CSLAW '27 full paper. ACM small single-column template (acmart, acmsmall).
#
# Class options: the quarto-journals/acm extension passes
# `acm-metadata.acmart-options` (set in manuscript.qmd) verbatim to
# \documentclass. "acmsmall,screen" is the submission setting; add
# ",review" for line numbers if the chairs ask for them.
#
# acmart version: the extension bundles acmart.cls v1.84 (2022), but Quarto
# does not copy it next to the .tex, so LaTeX loads the TeX Live acmart
# (v2.20 on 2026-09-26). That is the version ACM wants for new submissions.
#
# Engine: xelatex, as for the first-iteration draft. acmart v2
# supports it (Libertinus via fontspec), and xelatex takes the German
# umlauts, the section sign and the Unicode minus in the running text
# without extra setup. pdflatex would need \DeclareUnicodeCharacter work
# for the same text.
#
# Bibliography: the extension sets biblio-style te.bst and its lua filter
# replaces a "# References" header with a second \bibliographystyle, which
# BibTeX rejects. So biblio-style is ACM-Reference-Format here, and the
# manuscript prints its own references heading before the refs div instead
# of a "# References" header.
format:
  acm-pdf:
    keep-tex: true
    pdf-engine: xelatex
    biblio-style: ACM-Reference-Format
    template-partials:
      - _extensions/quarto-journals/acm/partials/title.tex
      - partials/_acmart_preamble.tex
      - partials/_acmart_authors.tex
      - _extensions/quarto-journals/acm/partials/_acmart_abstract.tex
    include-in-header:
      text: |
        \usepackage{tikz}
        \usetikzlibrary{positioning,arrows.meta,fit}
        \usepackage{multirow}
        % Visible marker for every number or result that does not exist yet.
        \newcommand{\pending}[1]{\textcolor{red}{[PENDING: #1]}}
        % Short marker for table cells.
        \newcommand{\tbd}{\textcolor{red}{\textbf{?}}}
        % Draft marker for sections still to be co-written.
        \newcommand{\draftnote}[1]{\textcolor{red}{\textit{[DRAFT: #1]}}}

execute:
  echo: false
  warning: false

bibliography: references.bib
