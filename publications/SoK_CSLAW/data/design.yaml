# The design space of legal grading rubrics (Section 7, tab:design): each dimension, its
# options, and what the evidence or the law says. The option we propose is
# given first; Section 7 gives the evidence and the open questions for each.
dimensions:
  - dim: "Unit of credit"
    options: "argument or requirement met; issue spotted; bare result"
    basis: "answer latitude (L2); experts agree almost perfectly on binary criteria"
  - dim: "Scale of a criterion"
    options: "binary; few levels; free points per step"
    basis: "binary agrees best; agreement is not the construct"
  - dim: "Structure"
    options: "all points on steps (absolute or as shares of the total); steps plus a bounded, reasoned component; steps plus a criteria-bound pool; steps plus a free pool"
    basis: "a free pool cannot be checked; a criteria-bound pool needs stated criteria and a fixed share"
  - dim: "Method and form"
    options: "within each section; separate block"
    basis: "within sections stays tied to content; a block needs stated criteria and a fixed share"
  - dim: "Alternative solutions"
    options: "outcome-neutral criteria and paths that record why a step is absent; flag unforeseen paths; single reference"
    basis: "L2; equal performance, not equal length; the examiner's rule for the total"
  - dim: "Follow-on errors"
    options: "standard per criterion (correct law or own earlier decision); none"
    basis: "not counted twice; the weight is the examiner's (L2)"
  - dim: "Cardinal errors"
    options: "defined in advance (minus points or a lower grade); left to the grader"
    basis: "examiners disagree; a deduction is itself a grading decision"
  - dim: "Points to grade"
    options: "examiner's key applied by code; key generated or applied by a model"
    basis: "the key to the legal scale is the examiner's (L1, L4); models mis-add"
  - dim: "Author and timing"
    options: "examiner, before grading; model draft with marked provenance, reviewed by the examiner; model alone"
    basis: "equal standards, versioned (L1); generated rubrics fall short"
